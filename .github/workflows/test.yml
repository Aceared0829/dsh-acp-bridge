name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The Windows leg matters most: the shim and the profile install are what a
    # desktop Harness actually runs, and path/junction behaviour differs there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # A profile install must resolve every import from inside the profile, so
      # the smoke test runs the packaged entry exactly as installed.
      - run: node test/host-smoke.mjs
