    <rect x="676" y="556" width="30" height="16" rx="8" fill="#25543a" stroke="#3d7d55"/>
    <circle cx="697" cy="564" r="5.5" fill="#8fd9ae"/>

    <text x="262" y="602" fill="#dce6f5" font-weight="600">_dsh_image_input</text>
    <text x="400" y="602" fill="#5f6d84">需要附件库 + 当前模型多模态</text>
    <rect x="676" y="590" width="30" height="16" rx="8" fill="#2a303c" stroke="#3a4354"/>
    <circle cx="685" cy="598" r="5.5" fill="#6f7c93"/>

    <text x="262" y="636" fill="#dce6f5" font-weight="600">_dsh_slash_commands</text>
    <text x="400" y="636" fill="#5f6d84">把 commands 注册表映射成 available_commands</text>
    <rect x="676" y="624" width="30" height="16" rx="8" fill="#2a303c" stroke="#3a4354"/>
    <circle cx="685" cy="632" r="5.5" fill="#6f7c93"/>

    <text x="262" y="670" fill="#dce6f5" font-weight="600">_dsh_plan / _dsh_usage</text>
    <text x="400" y="670" fill="#5f6d84">plan 与上下文用量上报（v1 标准更新）</text>
    <rect x="676" y="658" width="30" height="16" rx="8" fill="#25543a" stroke="#3d7d55"/>
    <circle cx="697" cy="666" r="5.5" fill="#8fd9ae"/>
  </g>
  <text x="262" y="706" fill="#4d586b" font-size="11">关掉的选项不下发，客户端看不到就不显示；currentValue 始终保证可用。</text>
  <text x="262" y="728" fill="#4d586b" font-size="11">改动写入本 profile 的 cordis.patch.yml，走 configEditor。</text>
  <text x="262" y="750" fill="#4d586b" font-size="11">服务重启后仍生效。</text>

  <!-- right: snippets -->
  <text x="744" y="426" fill="#96a6bd" font-size="12.5" font-weight="600">接入片段</text>
  <rect x="744" y="438" width="476" height="150" rx="9" fill="#141c27" stroke="#242e3d"/>
  <g font-size="11.5">
    <text x="760" y="464" fill="#8fa3bf" font-weight="600">Zed（settings.json）</text>
    <text x="760" y="486" fill="#7f8fa6" font-family="Consolas, monospace" font-size="11">"agent_servers": { "dsh": {</text>
    <text x="784" y="504" fill="#7f8fa6" font-family="Consolas, monospace" font-size="11">"command": { "path": "%DSH_HOME%\\acp-bridge\\bin\\acp.cmd" }</text>
    <text x="760" y="522" fill="#7f8fa6" font-family="Consolas, monospace" font-size="11">} }</text>
    <text x="760" y="548" fill="#8fa3bf" font-weight="600">通用 shell</text>
    <text x="760" y="568" fill="#7f8fa6" font-family="Consolas, monospace" font-size="11">dsh-acp-bridge print-launcher --format cmd</text>
    <rect x="1080" y="456" width="120" height="24" rx="6" fill="#1a2536" stroke="#35577f"/>
    <text x="1140" y="472" fill="#9fc7ff" font-size="11.5" text-anchor="middle">复制</text>
  </g>

  <!-- traffic -->
  <text x="744" y="612" fill="#96a6bd" font-size="12.5" font-weight="600">最近流量（脱敏，可暂停/清空）</text>
  <rect x="744" y="624" width="476" height="134" rx="9" fill="#0f151e" stroke="#242e3d"/>
  <g font-size="10.5" font-family="Consolas, monospace">
    <text x="760" y="648" fill="#4f8f6b">→ session/prompt        sess…a19  text×1</text>
    <text x="760" y="666" fill="#5a7fa8">← session/update        agent_thought_chunk</text>
    <text x="760" y="684" fill="#5a7fa8">← session/update        tool_call  bash</text>
    <text x="760" y="702" fill="#a88a4e">↔ request_permission    allow_once</text>
    <text x="760" y="720" fill="#5a7fa8">← session/update        usage_update 92.4k/200k</text>
    <text x="760" y="738" fill="#4f8f6b">→ session/cancel        $/cancel_request</text>
  </g>

  <!-- composer capsule -->
  <text x="40" y="812" fill="#8fa3bf" font-size="12" font-weight="600">会话内胶囊（conversation.input.right）：</text>
  <rect x="300" y="796" width="318" height="26" rx="13" fill="#1a2536" stroke="#35577f"/>
  <circle cx="316" cy="809" r="4" fill="#57c99a"/>
  <text x="328" y="813" fill="#cfe0f7" font-size="11.5">ACP · Zed</text>
  <text x="404" y="813" fill="#6f7c93" font-size="11">super-code · high · ws#1</text>
  <text x="638" y="812" fill="#5f6d84" font-size="11.5">← 点开可看到「这个会话正被谁驱动」，并允许一键踢掉该客户端</text>

  <text x="40" y="846" fill="#4d586b" font-size="11.5">面板只做观测与控制：所有真正的执行仍在 Host 里，界面不含任何 ACP 协议逻辑；断开/踢客户端都走同一个 disposer。</text>
</svg>
