  <!-- two-column lower -->
  <!-- left: options -->
  <text x="244" y="426" fill="#96a6bd" font-size="12.5" font-weight="600">对外暴露的选项（默认值 · 逐项开关）</text>
  <rect x="244" y="438" width="476" height="320" rx="9" fill="#141c27" stroke="#242e3d"/>
  <g font-size="11.5" fill="#9fb0c9">
    <text x="262" y="466" fill="#dce6f5" font-weight="600">model</text>
    <text x="400" y="466" fill="#5f6d84">按 provider 分组，取自实时 llm 目录</text>
    <rect x="676" y="454" width="30" height="16" rx="8" fill="#25543a" stroke="#3d7d55"/>
    <circle cx="697" cy="462" r="5.5" fill="#8fd9ae"/>

    <text x="262" y="500" fill="#dce6f5" font-weight="600">reasoning_effort</text>
    <text x="400" y="500" fill="#5f6d84">仅当模型声明 reasoning 时出现</text>
    <rect x="676" y="488" width="30" height="16" rx="8" fill="#25543a" stroke="#3d7d55"/>
    <circle cx="697" cy="496" r="5.5" fill="#8fd9ae"/>

    <text x="262" y="534" fill="#dce6f5" font-weight="600">mode（agent 模式）</text>
    <text x="400" y="534" fill="#5f6d84">来自 agentPresets 名单</text>
    <rect x="676" y="522" width="30" height="16" rx="8" fill="#25543a" stroke="#3d7d55"/>
    <circle cx="697" cy="530" r="5.5" fill="#8fd9ae"/>

