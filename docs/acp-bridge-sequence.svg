<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea8fe"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57c99a"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a869a"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a84e"/>
    </marker>
  </defs>

  <rect width="1240" height="930" fill="#0e1219"/>
  <text x="40" y="42" fill="#e8eef8" font-size="20" font-weight="700">一次 prompt turn 的时序，以及配置选项如何映射到 DSH 能力</text>

  <!-- sequence -->
  <text x="40" y="82" fill="#8fa3bf" font-size="12" font-weight="600" letter-spacing="1">A · 时序</text>

  <g font-size="12">
    <rect x="40" y="96" width="150" height="30" rx="6" fill="#1b2330" stroke="#2e3a4d"/>
    <text x="115" y="116" fill="#dce6f5" text-anchor="middle" font-weight="600">ACP 客户端</text>
    <rect x="330" y="96" width="150" height="30" rx="6" fill="#1b2330" stroke="#2e3a4d"/>
    <text x="405" y="116" fill="#dce6f5" text-anchor="middle" font-weight="600">stdio 垫片</text>
    <rect x="620" y="96" width="170" height="30" rx="6" fill="#1d2b3f" stroke="#3d5578"/>
    <text x="705" y="116" fill="#cfe0f7" text-anchor="middle" font-weight="600">acp-bridge</text>
    <rect x="930" y="96" width="180" height="30" rx="6" fill="#1f2430" stroke="#333c4d"/>
    <text x="1020" y="116" fill="#c9d4e4" text-anchor="middle" font-weight="600">AgentLoop</text>
  </g>
  <g stroke="#232d3c" stroke-width="1" stroke-dasharray="3 5">
    <line x1="115" y1="132" x2="115" y2="700"/>
    <line x1="405" y1="132" x2="405" y2="700"/>
    <line x1="705" y1="132" x2="705" y2="700"/>
    <line x1="1020" y1="132" x2="1020" y2="700"/>
  </g>

  <g font-size="11.5" fill="#9fb0c9">
    <g stroke="#6ea8fe" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <line x1="115" y1="160" x2="400" y2="160"/>
      <line x1="115" y1="228" x2="400" y2="228"/>
      <line x1="115" y1="404" x2="400" y2="404"/>
    </g>
    <text x="126" y="154">spawn dsh-acp-stdio</text>
    <text x="126" y="222">initialize / session/new</text>
    <text x="126" y="398">session/prompt</text>

    <g stroke="#6ea8fe" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <line x1="405" y1="180" x2="700" y2="180"/>
      <line x1="405" y1="248" x2="700" y2="248"/>
      <line x1="405" y1="424" x2="700" y2="424"/>
    </g>
    <text x="418" y="174">WS 连接 + token</text>
    <text x="418" y="242">同一帧 NDJSON</text>
    <text x="418" y="418">同一帧 NDJSON</text>

    <g stroke="#57c99a" stroke-width="1.6" fill="none" marker-end="url(#b)">
      <line x1="700" y1="268" x2="1015" y2="268"/>
      <line x1="700" y1="444" x2="1015" y2="444"/>
    </g>
    <text x="713" y="262">agents.create({cwd, agentOpinions})</text>
    <text x="713" y="438">agent.followup(userMessage)</text>

    <g stroke="#6ea8fe" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <line x1="1015" y1="300" x2="710" y2="300"/>
      <line x1="1015" y1="476" x2="710" y2="476"/>
    </g>
    <text x="980" y="294" text-anchor="end">session/* 事件</text>
    <text x="980" y="470" text-anchor="end">turn/start … turn/end</text>

    <g stroke="#7a869a" stroke-width="1.5" fill="none" marker-end="url(#c)">
      <line x1="700" y1="324" x2="410" y2="324"/>
      <line x1="700" y1="352" x2="410" y2="352"/>
      <line x1="700" y1="504" x2="410" y2="504"/>
    </g>
    <text x="686" y="318" text-anchor="end">configOptions</text>
    <text x="686" y="346" text-anchor="end">session/update × N</text>
    <text x="686" y="498" text-anchor="end">stopReason</text>

    <g stroke="#7a869a" stroke-width="1.5" fill="none" marker-end="url(#c)">
      <line x1="405" y1="200" x2="120" y2="200"/>
      <line x1="405" y1="372" x2="120" y2="372"/>
    </g>
    <text x="398" y="194" text-anchor="end">result</text>
    <text x="398" y="366" text-anchor="end">notify</text>
  </g>

  <!-- permission round trip -->
  <g>
    <rect x="440" y="530" width="600" height="120" rx="10" fill="#1a1f16" stroke="#4a5a33"/>
    <text x="460" y="556" fill="#cfe0a0" font-size="12.5" font-weight="600">打断式往返：需要用户点头的只有这一条路径</text>
    <g font-size="11.5" fill="#a8b58c">
      <text x="460" y="580">approval/request 事件 → bridge 发 session/request_permission</text>
      <text x="460" y="600">客户端回 allow_once / reject_once（或 allow_always 写成审批策略）</text>
      <text x="460" y="620">bridge 把结果交回 approval 服务 → 工具继续或中止，并落一条审计</text>
      <text x="460" y="640">超时策略可配：默认拒绝，可配「面板代答」</text>
    </g>
  </g>

  <!-- mapping table -->
  <text x="40" y="735" fill="#8fa3bf" font-size="12" font-weight="600" letter-spacing="1">B · 配置选项 → DSH 能力（能暴露的都暴露）</text>

  <g font-size="11.5">
    <rect x="40" y="748" width="1160" height="26" rx="4" fill="#161d27"/>
    <text x="54" y="766" fill="#8fa3bf" font-weight="600">ACP configOption</text>
    <text x="286" y="766" fill="#8fa3bf" font-weight="600">category</text>
    <text x="392" y="766" fill="#8fa3bf" font-weight="600">取值来源</text>
    <text x="640" y="766" fill="#8fa3bf" font-weight="600">落到 DSH 的哪一层</text>
    <text x="1000" y="766" fill="#8fa3bf" font-weight="600">生效时机</text>

    <g fill="#9fb0c9">
      <text x="54" y="798">model（分组 select）</text><text x="286" y="798">model</text>
      <text x="392" y="798">llm.listProviders × listModels</text><text x="640" y="798">agent.model 选择，值 = JSON[provider,model]</text><text x="1000" y="798">下一个模型步</text>
      <line x1="40" y1="808" x2="1200" y2="808" stroke="#1b2330"/>

      <text x="54" y="826">reasoning_effort</text><text x="286" y="826">thought_level</text>
      <text x="392" y="826">resolveModelInfo(...).reasoning</text><text x="640" y="826">ReasoningEffortId（含「provider default」）</text><text x="1000" y="826">下一个模型步</text>
      <line x1="40" y1="836" x2="1200" y2="836" stroke="#1b2330"/>

      <text x="54" y="858">mode（agent 模式）</text><text x="286" y="858">mode</text>
      <text x="392" y="858">agentPresets.list()</text><text x="640" y="858">preset 选择 → 工具集/提示词/权限策略</text><text x="1000" y="858">首轮前 / 空会话换组合</text>
    </g>
  </g>

  <g font-size="11.5" fill="#7a869a">
    <text x="40" y="912">超出 v1 标准、用 _dsh_ 前缀的扩展项：图片输入开关、斜杠命令白名单、plan 上报、usage 上报、权限策略预设——客户端不认就退化成 currentValue，不影响可用性。</text>
  </g>
</svg>
